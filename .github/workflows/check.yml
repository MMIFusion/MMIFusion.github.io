name: Check website content
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static pages
        run: python scripts/build.py
      - name: Check content and links
        run: python scripts/check.py
      - name: Check image statistics against analytical fixtures
        run: node scripts/test_metrics.cjs
      - name: Check calendar dates and playful cards
        run: node scripts/test_community.cjs
      - name: Check real deadline and date-only boundaries
        run: node scripts/test_calendar.cjs
      - name: Check generated pages are up to date
        run: git diff --exit-code -- '*.html' robots.txt sitemap.xml downloads
